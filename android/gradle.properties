# ── JVM ──────────────────────────────────────────────────────────────────────
#
# 3 GB heap, not 8. On a 16 GB machine the previous `-Xmx8G
# -XX:MaxMetaspaceSize=4G` let a single Gradle daemon claim 12 GB — more than
# the machine has free once an emulator, the Dart analysis server and an IDE are
# running. The JVM does not reserve that up front, so it looks harmless until a
# big build expands into it and the kernel kills whatever it reaches first.
#
# A Flutter Android build fits comfortably in 3 GB; the Kotlin daemon gets its
# own below.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC

# The Kotlin compile daemon is a second JVM and inherits nothing from the line
# above. Left unset it sizes itself from total RAM and becomes the next
# surprise.
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=384m

# ── Build behaviour ──────────────────────────────────────────────────────────
#
# Caching and incremental compilation cost disk, not RAM, and save whole
# rebuilds during a screenshot loop that runs many times a day.
org.gradle.caching=true
org.gradle.configureondemand=true

# Parallel execution multiplies peak memory by the number of workers. Two is
# the useful part of the speedup without the multiplication.
org.gradle.parallel=true
org.gradle.workers.max=2

android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
