# Static analysis for MediHive. `flutter analyze` must be clean before any
# change lands — the CI gate and the agent rules in `.agents/RULES.md` both
# assume a zero-issue baseline, and a baseline with three known warnings in it
# is a baseline nobody reads.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # The design system is the contract. A screen that reaches past it is a
    # defect, and a defect the analyzer can see should stop the build rather
    # than wait for review.
    deprecated_member_use_from_same_package: error
    unused_import: error
    unused_local_variable: error

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # ── Correctness ───────────────────────────────────────────────────────
    always_use_package_imports: false
    avoid_dynamic_calls: true
    avoid_empty_else: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    # A `print` in a release build is an unredacted log line on a device that
    # holds patient data. Everything goes through `AppLog`, which is
    # debug-only and redacts.
    avoid_print: true
    unawaited_futures: true

    # ── Style, so diffs read as changes and not as reformatting ───────────
    prefer_single_quotes: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true
    prefer_relative_imports: true
    directives_ordering: true
    sort_child_properties_last: true
    require_trailing_commas: true

    # ── Flutter ───────────────────────────────────────────────────────────
    use_key_in_widget_constructors: true
    use_colored_box: true
    use_decorated_box: true
    sized_box_for_whitespace: true
    avoid_unnecessary_containers: true
