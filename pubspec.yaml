name: medihive
description: "MediHive — the hospital operations companion app."
# Private package: never publish to pub.dev.
publish_to: 'none'

# version is build-name + build-number. Android reads them as versionName /
# versionCode; iOS as CFBundleShortVersionString / CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State, DI and navigation. One package, because mixing a DI container with
  # GetX's own route bindings produces two lifetimes for the same controller.
  get: ^4.7.3

  # HTTP, behind the single `DioClient`. Never constructed directly elsewhere.
  dio: ^5.9.2

  # The bearer token and the cached session. Encrypted at rest on both OSes.
  flutter_secure_storage: ^9.2.4

  # The last applied brand and face, restored before the first frame so a cold
  # start never paints one frame in the wrong theme.
  shared_preferences: ^2.5.5

  # Dates, durations and figures. A ward board shows a length-of-stay and an
  # admission time on every row, and the site chooses the locale, so formatting
  # is locale-driven, never string concatenation.
  intl: ^0.20.2

  # Census trends and bed-occupancy ramps on the dashboard.
  fl_chart: ^1.2.0

  # ── What a patient hands the device ──────────────────────────────────────
  #
  # Each of the three sits behind an interface in `lib/app/data/services/`, so
  # nothing above that line knows a plugin is there and no test has to answer
  # a method channel. `image_picker` is a photo of the thing they want looked
  # at; `file_picker` is a letter or a result they already hold; `record` is
  # the answer they would rather speak than type.
  image_picker: ^1.2.3

  # Held at 11.x, and not by preference. Every `file_picker` from 12.0.0 up
  # reaches Windows through `win32 ^6`, and `flutter_secure_storage 9.2.4` —
  # which holds the bearer token and the cached session — pins `win32 ^5`.
  # The two cannot both be satisfied, and the version that would have to move
  # to break the tie is the one the sign-in depends on. The picker API this
  # app uses (`FilePicker.platform.pickFiles`, `PlatformFile.bytes`,
  # `withData:`) is identical across all of them, so the seam loses nothing.
  file_picker: ^11.0.3

  # Held below 7.x for the same kind of reason. `record` 7.0.0 raised its floor
  # to Dart 3.12 / Flutter 3.44 and this app is pinned to 3.10.3 / 3.38.4;
  # moving the toolchain to gain a recorder re-resolves every other package
  # with it.
  record: ^6.2.1

  # The other direction: a question read back to a patient who cannot read the
  # screen. `record` is capture-only, so without this the app had no way to play
  # the WAV that `POST /api/case-taking/tts` has been able to return all along —
  # the server half of read-aloud was built and had no client.
  #
  # `audioplayers` rather than `just_audio` for one reason that decided it: it
  # resolves against `win32 5.15.0`, which `flutter_secure_storage 9.2.4` pins
  # and which `file_picker` above is held at 11.x to protect. A player that
  # forced `win32 ^6` would break the sign-in to gain a convenience.
  #
  # Used only behind `data/services/speech_player.dart`, so the plugin is not
  # reachable from a widget test.
  audioplayers: ^6.5.1

  # The runtime grant the three above need, and the only permission_handler
  # call site in the app is `data/services/media_permissions.dart` — so the
  # sentence a patient reads when they say no is written once.
  #
  # Held below 13. `permission_handler_android` 14.1.0 ships a
  # `build.gradle.kts` whose `plugins {}` block declares only
  # `com.android.library`, and then calls a `kotlin { compilerOptions { … } }`
  # extension that exists only where the Kotlin plugin has been applied. The
  # Android build fails to configure with "Unresolved reference: jvmTarget"
  # before a line of this app is compiled. Nothing here can fix a build script
  # inside somebody else's package, so the constraint is the fix.
  permission_handler: ^12.0.0

  # The fourth way in, and the only one that is a *conversation* rather than a
  # turn: a room the patient's microphone is published into, with partial
  # transcripts coming back as they speak. The question text still arrives on
  # the existing HTTP turn, which answers in about fifteen milliseconds — this
  # carries audio and interim text, and nothing clinical depends on it.
  #
  # Checked against the pins above before it was added, because three of them
  # exist to protect `win32 5.15.0` and a fourth is held below its own major
  # for an unrelated reason. `livekit_client 2.13.0` moves none of them: it
  # resolves as eighteen *new* packages — `flutter_webrtc`, `dart_webrtc`,
  # `protobuf`, `connectivity_plus`, `device_info_plus` and their transitives —
  # and `win32` stays at 5.15.0, `flutter_secure_storage` at 9.2.4,
  # `file_picker` at 11.0.3, `record` at 6.2.1 and `permission_handler` at
  # 12.0.3. The one that could have gone wrong is `win32_registry`, which
  # `device_info_plus` needs: 3.0.3 wants `win32 ^6`, and the solver takes
  # 2.1.0 instead rather than moving the package the sign-in depends on.
  #
  # Reachable from exactly one file — `data/services/livekit_voice_session.dart`
  # — behind `data/services/voice_session.dart`, so no widget test has to
  # answer a method channel and a build without it loses nothing but a
  # convenience. It asks for the microphone through `media_access.dart` like
  # everything else, so the sentence a patient reads when they say no is still
  # written once.
  livekit_client: ^2.13.0
  pdfx: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Drives the end-to-end suite in `integration_test/`. The same flow
  # registrars also run under plain `flutter test` from `test/e2e/`, which is
  # how the PR gate covers them without booting an emulator.
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    # SIL Open Font License texts for the bundled faces, shipped with them.
    - assets/fonts/licenses/

  # The site's selectable font registry, bundled face for face so a
  # `theme_font` choice renders with no runtime fetch. The google_fonts package
  # downloads font files on first paint of each screen, which is the
  # release-build stutter this avoids. Variable fonts where Google ships one;
  # static weights for Poppins and Lato. Mirrors `AppFontRegistry`.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
    - family: Open Sans
      fonts:
        - asset: assets/fonts/OpenSans.ttf
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Work Sans
      fonts:
        - asset: assets/fonts/WorkSans.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

# Regenerate with `dart run flutter_launcher_icons` after changing the master.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0C1114"
  min_sdk_android: 21
  # iOS rejects an icon with an alpha channel at submission.
  remove_alpha_ios: true
