name: medihive
description: "MediHive — the hospital operations companion app."
# Private package: never publish to pub.dev.
publish_to: 'none'

# version is build-name + build-number. Android reads them as versionName /
# versionCode; iOS as CFBundleShortVersionString / CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State, DI and navigation. One package, because mixing a DI container with
  # GetX's own route bindings produces two lifetimes for the same controller.
  get: ^4.7.3

  # HTTP, behind the single `DioClient`. Never constructed directly elsewhere.
  dio: ^5.9.2

  # The bearer token and the cached session. Encrypted at rest on both OSes.
  flutter_secure_storage: ^9.2.4

  # The last applied brand and face, restored before the first frame so a cold
  # start never paints one frame in the wrong theme.
  shared_preferences: ^2.5.5

  # Dates, durations and figures. A ward board shows a length-of-stay and an
  # admission time on every row, and the site chooses the locale, so formatting
  # is locale-driven, never string concatenation.
  intl: ^0.20.2

  # Census trends and bed-occupancy ramps on the dashboard.
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Drives the end-to-end suite in `integration_test/`. The same flow
  # registrars also run under plain `flutter test` from `test/e2e/`, which is
  # how the PR gate covers them without booting an emulator.
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    # SIL Open Font License texts for the bundled faces, shipped with them.
    - assets/fonts/licenses/

  # The site's selectable font registry, bundled face for face so a
  # `theme_font` choice renders with no runtime fetch. The google_fonts package
  # downloads font files on first paint of each screen, which is the
  # release-build stutter this avoids. Variable fonts where Google ships one;
  # static weights for Poppins and Lato. Mirrors `AppFontRegistry`.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
    - family: Open Sans
      fonts:
        - asset: assets/fonts/OpenSans.ttf
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Work Sans
      fonts:
        - asset: assets/fonts/WorkSans.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

# Regenerate with `dart run flutter_launcher_icons` after changing the master.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0C1114"
  min_sdk_android: 21
  # iOS rejects an icon with an alpha channel at submission.
  remove_alpha_ios: true
